<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AniTime Complete</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body onload="onload()">

    <div id="preload-cache" style="position:absolute; width:0; height:0; overflow:hidden; opacity:0;"></div>

    <div id="ani-time-root">
        <div class="time-box">
            <div class="char-block" id="b-h1"><div class="anime-sprite" id="c-h1"></div></div>
            <div class="char-block" id="b-h2"><div class="anime-sprite" id="c-h2"></div></div>
            <div class="divider">:</div>
            <div class="char-block" id="b-m1"><div class="anime-sprite" id="c-m1"></div></div>
            <div class="char-block" id="b-m2"><div class="anime-sprite" id="c-m2"></div></div>
            <div class="divider sec-element">:</div>
            <div class="char-block sec-element" id="b-s1"><div class="anime-sprite" id="c-s1"></div></div>
            <div class="char-block sec-element" id="b-s2"><div class="anime-sprite" id="c-s2"></div></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
